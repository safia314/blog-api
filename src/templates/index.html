<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog App</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#f4f6fb;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{

    width:650px;
    background:white;
    border-radius:15px;
    padding:40px;

    box-shadow:0 15px 35px rgba(0,0,0,.1);

}

h1{
    text-align:center;
    margin-bottom:10px;
    color:#333;
}

p{
    text-align:center;
    color:gray;
    margin-bottom:30px;
}

label{

    display:block;
    margin-bottom:8px;
    font-weight:bold;
    color:#444;

}

input,textarea{

    width:100%;
    padding:15px;
    margin-bottom:20px;

    border:1px solid #ddd;
    border-radius:10px;

    font-size:16px;

}

textarea{

    resize:none;
    height:180px;

}

button{

    width:100%;
    padding:15px;

    border:none;

    border-radius:10px;

    background:#4f46e5;

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.3s;

}

button:hover{

    background:#3730a3;

}

#message{

    margin-top:20px;
    text-align:center;
    color:green;
    font-weight:bold;

}

</style>

</head>
<body>

<div class="container">

<h1>Blog Manager</h1>

<p>Create your own blog post.</p>

<label>Title</label>

<input
id="title"
placeholder="Enter blog title">

<label>Content</label>

<textarea
id="content"
placeholder="Write your blog here..."></textarea>

<button onclick="createBlog()">

Create Blog

</button>

<div id="message"></div>

</div>

<script>

async function createBlog(){

const title=document.getElementById("title").value;
const content=document.getElementById("content").value;

const response=await fetch("http://127.0.0.1:8000/blogs/",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

title:title,
content:content

})

});

if(response.ok){

document.getElementById("message").innerHTML="Blog created successfully.";

document.getElementById("title").value="";
document.getElementById("content").value="";

}

else{

document.getElementById("message").innerHTML="Error creating blog.";

}

}

</script>

</body>
</html>
